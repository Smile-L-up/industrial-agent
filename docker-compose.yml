# Industrial Agent Docker Compose
# 智能体项目 Docker Compose 配置

version: '3.8'

services:
  # 智能体 API 服务
  industrial-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: industrial-agent
    ports:
      - "18000:18000"
    environment:
      # LLM API 密钥配置
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-sk-da3613b86fe84367926bcda009297dac}
      # 其他环境变量
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Shanghai
    volumes:
      # 挂载缓存目录（可选，用于持久化模型缓存）
      - hf-cache:/root/.cache/huggingface
      # 挂载日志目录（可选）
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - industrial-network

  # Nginx 反向代理（可选，用于生产环境）
  # nginx:
  #   image: nginx:alpine
  #   container_name: industrial-agent-nginx
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - industrial-agent
  #   restart: unless-stopped
  #   networks:
  #     - industrial-network

# 数据卷
volumes:
  hf-cache:
    driver: local
    name: industrial-agent-hf-cache

# 网络
networks:
  industrial-network:
    driver: bridge
    name: industrial-network