# Industrial Agent Intranet Docker Compose
# 智能体项目内网部署 Docker Compose 配置（使用外部 MySQL 服务）
# 注意：所有配置直接在此文件中修改，无需修改.env 文件

version: '3.8'

services:
  # 智能体 API 服务
  industrial-agent:
    image: industrial-agent:latest  # 使用已构建的镜像
    container_name: industrial-agent
    ports:
      - "18000:18000"
    environment:
      # ==================== LLM 配置 ====================
      - DASHSCOPE_API_KEY=sk-da3613b86fe84367926bcda009297dac
      - LLM_PROVIDER=openai
      - LLM_MODEL=qwen3.5-plus
      - LLM_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1
      
      # ==================== 数据库配置 ====================
      - DB_TYPE=mysql
      - SQLITE_PATH=data/agent.db
      - MYSQL_HOST=192.168.110.200
      - MYSQL_PORT=33306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=Huayun@2024ZB
      - MYSQL_DATABASE=ai_base
      
      # ==================== 会话配置 ====================
      - SESSION_MAX_HISTORY=10
      - SESSION_TTL_MINUTES=30
      - SESSION_MAX_SESSIONS=100
      
      # ==================== 代理配置 ====================
      - AGENT_MAX_ITERATIONS=10
      
      # ==================== 系统配置 ====================
      - TZ=Asia/Shanghai
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    volumes:
      # 挂载配置目录（用于热更新配置）
      - ./config.py:/app/config.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - industrial-network

# 网络
networks:
  industrial-network:
    driver: bridge
    name: industrial-network